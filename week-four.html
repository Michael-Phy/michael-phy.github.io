        <p>For external 10k pull-down resistor circuit:<ul<li>Button released: Pin connected to GND through resistor → <code>digitalRead() ==</li><li>Button pressed: Pin connected to 3.3V power rail<code>digitalRead() == HIGH</code><li>Mechanical jitter elimination: Double delay detection + wait-for-release while loop to avoid multiple triggers from one press.</ul</div><div class="note-card">
        <h4>4. Boolean</h4<p>Use bool variable to store device running state, flip state with<code>var = !</p><pre>

        <p>When <code>motorRunning = true</code>: Motor forward rotation; When false: Both control pins pull low to cut power</p></div>

   <div class="note-card<h4>6. Timing Methods: Blocking vs Non-B</h4>
<ul>
           <code>delay</code>: Blocking timing, pauses the entire program during waiting period, unsuitable for multi-task parallel</li>
           <code>mill</code>: Non-blocking timing, returns total running milliseconds after boot, allows multiple independent timing tasks at the same</li</ul></div>

<div class="note<h4>7. DC Motor L298N / L9110 Dual</h4<ul><li>A1A = HIGH, A1B = LOW: Motor forward</li>
